# =============================================================================
# LegalCase ERP - Render Blueprint (free hosting)
#
# What this does
#   Deploys the browser UI + REST API + AI pipeline as ONE free Docker web
#   service on Render. The database lives outside Render, on a free Neon
#   PostgreSQL project, because Render's free web services cannot attach a
#   persistent disk (the H2 file database would be wiped on every restart).
#
# How to use it
#   1. Push this repository to GitHub.
#   2. Create a free PostgreSQL project at https://neon.tech and copy its
#      connection details (host, database, user, password).
#   3. Render dashboard -> New -> Blueprint -> pick this repository.
#   4. When Render asks, paste LCE_DB_URL / LCE_DB_USER / LCE_DB_PASSWORD.
#      Use the JDBC form: jdbc:postgresql://<host>/<db>?sslmode=require
#   5. Deploy, wait for "Live", open the https URL, sign in as
#      ally@mongalalaw.co.za / lawyer123
#
# Full walkthrough: docs/DEPLOYMENT_FREE_HOSTING.md
# =============================================================================
services:
  - type: web
    name: legalcase-erp
    runtime: docker
    plan: free
    region: frankfurt          # closest Render region to South Africa
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- secrets: generated by Render, never stored in the repository ---
      - key: LCE_JWT_SECRET
        generateValue: true
      - key: LCE_ENCRYPTION_KEY      # AES-256-GCM key material for documents at rest
        generateValue: true

      # --- database: paste your free Neon PostgreSQL details when prompted ---
      - key: LCE_DB_URL              # jdbc:postgresql://<host>/<db>?sslmode=require
        sync: false
      - key: LCE_DB_USER
        sync: false
      - key: LCE_DB_PASSWORD
        sync: false

      # --- runtime ---
      - key: LCE_DATA_DIR
        value: /app/data           # ephemeral on the free plan (uploads reset on restart)
      - key: LCE_DEMO_AUTH
        value: "false"
      - key: LCE_DATA_RESIDENCY
        value: ZA
      # 512 MB container: keep the JVM inside the box
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx300m -XX:MaxMetaspaceSize=120m -XX:MaxDirectMemorySize=64m -Xss512k -XX:+UseSerialGC
