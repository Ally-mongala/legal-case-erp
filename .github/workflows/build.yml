name: CI - build, test, deploy

# DevOps (learning outcome D.1.1): every push builds all modules, runs the
# smoke tests and the API e2e suite. On the main branch it also builds the
# Docker image (cloud-ready, D.1.2).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build all modules
        run: mvn -B clean install -DskipTests

      - name: Compile & run the smoke test (service layer)
        run: |
          CP="frontend/target/classes:shared/target/classes:$(find ~/.m2 -name 'javafx-*.jar' | tr '\n' ':')"
          mkdir -p frontend/target/test-classes
          javac -cp "$CP" -d frontend/target/test-classes \
            frontend/src/test/java/za/co/mongala/legal/SmokeTest.java
          java -cp "frontend/target/classes:shared/target/classes:frontend/target/test-classes:$CP" \
            za.co.mongala.legal.SmokeTest

  e2e:
    name: End-to-end API tests
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B clean install -DskipTests

      - name: Start backend (H2, demo auth for e2e)
        run: |
          LCE_DEMO_AUTH=true java -jar backend/target/legal-backend.jar &
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8080/api/health

      - name: Run e2e suites
        run: |
          cd docs
          bash test-case-upload.sh
          bash e2e.sh
          bash e2e_v5.sh

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t legal-case-erp-backend -f backend/Dockerfile .

      - name: Validate compose
        run: docker compose config -q
