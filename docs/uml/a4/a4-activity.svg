-size="421.875" lengthAdjust="spacing" textLength="444.1223" x="10958.0589" y="7988.7299">no</text><text fill="#17233D" font-family="Carlito" font-size="421.875" lengthAdjust="spacing" textLength="5057.1442" x="8413.8618" y="7467.4957">Document matches the case?</text><text fill="#000000" font-family="Carlito" font-size="421.875" lengthAdjust="spacing" textLength="565.8646" x="13514.756" y="7206.8787">yes</text><rect fill="#F4F7FB" height="583.7341" rx="39.0625" ry="39.0625" style="stroke:#1F3864;stroke-width:1.5625;" width="16324.1211" x="2780.3734" y="8790.0024"/><text fill="#17233D" font-family="Carlito" font-size="421.875" lengthAdjust="spacing" textLength="16255.3711" x="2814.7484" y="9226.0651">status = PROCESSED; three-paragraph summary drafted; deadlines created; audit entry written</text><rect fill="#F4F7FB" height="583.7341" rx="39.0625" ry="39.0625" style="stroke:#1F3864;stroke-width:1.5625;" width="11191.1713" x="5346.8483" y="9479.2206"/><text fill="#17233D" font-family="Carlito" font-size="421.875" lengthAdjust="spacing" textLength="11122.4213" x="5381.2233" y="9915.2832">Attorney reviews, corrects if needed, and approves the summary</text><rect fill="#555555" height="18.75" rx="7.8125" ry="7.8125" style="stroke:#555555;stroke-width:3.125;" width="17165.2527" x="2359.8076" y="10125.4547"/><rect fill="#F4F7FB" height="583.7341" rx="39.0625" ry="39.0625" style="stroke:#1F3864;stroke-width:1.5625;" width="8583.2916" x="2403.5576" y="10206.7047"/><text fill="#17233D" font-family="Carlito" font-size="421.875" lengthAdjust="spacing" textLength="8514.5416" x="2437.9326" y="10642.7673">Deadlines synchronised, or exported as an .ics file</text><rect fill="#F4F7FB" height="583.7341" rx="39.0625" ry="39.0625" style="stroke:#1F3864;stroke-width:1.5625;" width="8406.9611" x="11074.3492" y="10206.7047"/><text fill="#17233D" font-family="Carlito" font-size="421.875" lengthAdjust="spacing" textLength="8338.2111" x="11108.7242" y="10642.7673">Client reads the approved 