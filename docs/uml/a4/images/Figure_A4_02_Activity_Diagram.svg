<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1168px" preserveAspectRatio="none" style="width:662px;height:1168px;background:#FFFFFF;" version="1.1" viewBox="0 0 662 1168" width="662px" zoomAndPan="magnify"><title>Figure A4-2: Activity Diagram - Demonstrated End-to-End Workflow</title><defs/><g><text fill="#000000" font-family="Carlito" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="393.0117" x="133.29" y="34.3301">Figure A4-2: Activity Diagram - Demonstrated End-to-End Workflow</text><ellipse cx="331.2959" cy="60.0898" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F4F7FB" height="36.6484" rx="12.5" ry="12.5" style="stroke:#1F3864;stroke-width:0.5;" width="248.4063" x="207.0928" y="90.0898"/><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="226.4063" x="218.0928" y="112.5156">Sign in, open a case, choose a file, tick consent</text><rect fill="#F4F7FB" height="36.6484" rx="12.5" ry="12.5" style="stroke:#1F3864;stroke-width:0.5;" width="219.1445" x="221.7236" y="204.3594"/><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="197.1445" x="232.7236" y="226.7852">Show the specific error (401 / 403 / 400)</text><ellipse cx="331.2959" cy="277.3594" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="331.2959" cy="277.3594" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#FFF9E3" points="263.7275,146.7383,398.8643,146.7383,410.8643,162.3867,398.8643,178.0352,263.7275,178.0352,251.7275,162.3867,263.7275,146.7383" style="stroke:#C9A227;stroke-width:0.5;"/><text fill="#000000" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="12.6328" x="336.2959" y="190.4609">no</text><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="133.1367" x="264.7275" y="159.1641">Token, scope, file type, size</text><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="104.9883" x="264.7275" y="173.8125">and consent all valid?</text><text fill="#000000" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="16.0957" x="411.8643" y="158.1641">yes</text><rect fill="#F4F7FB" height="36.6484" rx="12.5" ry="12.5" style="stroke:#1F3864;stroke-width:0.5;" width="471.0742" x="95.7588" y="330.3594"/><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="449.0742" x="106.7588" y="352.7852">Encrypt with AES-256-GCM, store, set status = PROCESSING, queue the job, return HTTP 202</text><rect fill="#F4F7FB" height="36.6484" rx="12.5" ry="12.5" style="stroke:#1F3864;stroke-width:0.5;" width="205.1289" x="228.7314" y="437.332"/><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="183.1289" x="239.7314" y="459.7578">status = FAILED, Retry offered (FR-12)</text><ellipse cx="331.2959" cy="512.1563" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="331.2959" cy="512.1563" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#FFF9E3" points="288.1465,387.0078,374.4453,387.0078,386.4453,399.0078,374.4453,411.0078,288.1465,411.0078,276.1465,399.0078,288.1465,387.0078" style="stroke:#C9A227;stroke-width:0.5;"/><text fill="#000000" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="12.6328" x="336.2959" y="423.4336">no</text><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="84.2988" x="289.1465" y="403.1094">Text extractable?</text><text fill="#000000" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="16.0957" x="387.4453" y="394.7852">yes</text><rect fill="#F4F7FB" height="36.6484" rx="12.5" ry="12.5" style="stroke:#1F3864;stroke-width:0.5;" width="640.5918" x="11" y="565.1563"/><text fill="#17233D" font-family="Carlito" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="126.8672" x="22" y="587.582">EMERGING TECHNOLOGY</text><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="486.2988" x="154.293" y="587.582">Extract parties, dates, case number, court and amount, each with confidence, source span and page</text><rect fill="#F4F7FB" height="36.6484" rx="12.5" ry="12.5" style="stroke:#1F3864;stroke-width:0.5;" width="330.7598" x="165.916" y="621.8047"/><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="308.7598" x="176.916" y="644.2305">Compare the extracted parties and matter with the case record</text><rect fill="#F4F7FB" height="36.6484" rx="12.5" ry="12.5" style="stroke:#1F3864;stroke-width:0.5;" width="567.4492" x="47.5713" y="728.7773"/><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="545.4492" x="58.5713" y="751.2031">status = REJECTED with a stated reason; conflicting fields highlighted; entry in the administrator rejection report</text><ellipse cx="331.2959" cy="803.6016" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="331.2959" cy="803.6016" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#FFF9E3" points="258.3721,678.4531,404.2197,678.4531,416.2197,690.4531,404.2197,702.4531,258.3721,702.4531,246.3721,690.4531,258.3721,678.4531" style="stroke:#C9A227;stroke-width:0.5;"/><text fill="#000000" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="12.6328" x="336.2959" y="714.8789">no</text><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="143.8477" x="259.3721" y="694.5547">Document matches the case?</text><text fill="#000000" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="16.0957" x="417.2197" y="686.2305">yes</text><rect fill="#F4F7FB" height="36.6484" rx="12.5" ry="12.5" style="stroke:#1F3864;stroke-width:0.5;" width="484.375" x="89.1084" y="856.6016"/><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="462.375" x="100.1084" y="879.0273">status = PROCESSED; three-paragraph summary drafted; deadlines created; audit entry written</text><rect fill="#F4F7FB" height="36.6484" rx="12.5" ry="12.5" style="stroke:#1F3864;stroke-width:0.5;" width="338.3711" x="162.1104" y="913.25"/><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="316.3711" x="173.1104" y="935.6758">Attorney reviews, corrects if needed, and approves the summary</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="579.3672" x="41.6123" y="969.8984"/><rect fill="#F4F7FB" height="36.6484" rx="12.5" ry="12.5" style="stroke:#1F3864;stroke-width:0.5;" width="264.1914" x="55.6123" y="995.8984"/><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="242.1914" x="66.6123" y="1018.3242">Deadlines synchronised, or exported as an .ics file</text><rect fill="#F4F7FB" height="36.6484" rx="12.5" ry="12.5" style="stroke:#1F3864;stroke-width:0.5;" width="259.1758" x="347.8037" y="995.8984"/><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="237.1758" x="358.8037" y="1018.3242">Client reads the approved summary in the portal</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="579.3672" x="41.6123" y="1052.5469"/><rect fill="#F4F7FB" height="36.6484" rx="12.5" ry="12.5" style="stroke:#1F3864;stroke-width:0.5;" width="267.8301" x="197.3809" y="1078.5469"/><text fill="#17233D" font-family="Carlito" font-size="12" lengthAdjust="spacing" textLength="245.8301" x="208.3809" y="1100.9727">Client messages the attorney and rates the service</text><ellipse cx="331.2959" cy="1146.1953" fi